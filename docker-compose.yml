services:
  lenny-biography:
    build: .
    container_name: lenny-biography
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - backend/.env # holds TMDB_API_KEY
    environment:
      # Container paths (see the volumes below). Separate with semicolons.
      MOVIES_MEDIA_DIRS: "/media/movies;/media/anime"
      CATALOG_SCAN_INTERVAL_SECONDS: "60"
      METADATA_RETRY_INTERVAL_SECONDS: "21600"
    volumes:
      # --- Your media (read-only). Override these host paths when needed ---
      - type: bind
        source: ${MOVIES_HOST_PATH:-E:/Win_Vault/Movies}
        target: /media/movies
        read_only: true
      - type: bind
        source: ${ANIME_HOST_PATH:-E:/Win_Vault/Anime}
        target: /media/anime
        read_only: true

      # --- Saved posters, backdrops and cast photos (re-uses what you already have) ---
      - ./static/thumbnails:/app/static/thumbnails
      - ./static/cast:/app/static/cast

      # --- Catalog database + movies.json (kept between restarts) ---
      - portal_db:/app/backend/data
      - portal_catalog:/app/data

volumes:
  portal_db:
  portal_catalog:
